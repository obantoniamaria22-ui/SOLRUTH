<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista Categorías</title>
    <link rel="stylesheet" href="css/categoria.css">
    
</head>
<body>
    <h1>SOLRUTH</h1>
    <h2>Registrar categoría</h2>

    <form id="FormCategoria">
        <div>
            <label for="idCategoria">ID categoría</label>
            <input type="number" id="id_categoria" required>
        </div>
        
        <div>
            <label for="nombreCategoria">Nombre de categoría</label>
            <input type="text" id="nombre_categoria" required>
        </div>

        <button type="submit">Guardar categoría</button>
    </form>
    <script src="categoria.js" defer></script>
</body>
</html>
