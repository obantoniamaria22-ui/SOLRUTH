<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLRUTH</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <header>
        <h1>Gestión de Inventario y Ventas</h1>
        <nav>
            <button onclick="mostrarSeccion('inventario')">Inventario</button>
            <button onclick="mostrarSeccion('catalogo')">catalogo / Venta</button>
        </nav>
    </header>

    <main>

        <section id="seccion-inventario" class="seccion">
            <h2>Agregar Nuevo Producto</h2>
            <form id="form-producto">
                <input type="text" id="nombre" placeholder="Nombre de la prenda" required>
                <input type="number" id="precio" placeholder="Precio ($)" required>
                <input type="number" id="stock" placeholder="Cantidad en stock" required>
                <button type="submit">Guardar Producto</button>
            </form>

            <h2>Listado de Productos</h2>
            <table id="tabla-inventario">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </section>


        <section id="seccion-catalogo" class="seccion oculto">
            <h2>Catálogo de Ropa</h2>
            <div id="grid-catalogo" class="grid-productos">
                <!-- Las tarjetas de productos se cargan con JS -->
            </div>

            <div class="carrito-resumen">
                <h3>Carrito de Compras</h3>
                <ul id="lista-carrito">
                    <li>El carrito está vacío</li>
                </ul>
                <p>Total: $<span id="total-carrito">0</span></p>
                <button onclick="finalizarCompra()">Finalizar Compra</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
