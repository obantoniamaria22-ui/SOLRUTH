<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Clientes - SportFit</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>
    <h1>SPORTFIT STORE</h1>
</header>

    <main>

        <h2>Registro de Cliente</h2>

        <form id="formCliente">

        <label>ID Usuario</label>
        <input type="number" id="idUsuario" required>

            <label>Nombre</label>
            <input type="text" id="nombre" required>

            <label>Correo electrónico</label>
            <input type="email" id="correo" required>

            <label>Contraseña</label>
            <input type="password" id="contrasena" required>

        <label>Fecha de registro</label>
        <input type="date" id="fechaRegistro" required>

            <button type="submit">
                Registrarse
            </button>

        </form>

        <hr>

        <h2>Iniciar sesión</h2>

        <form id="formLogin">

            <label>Correo electrónico</label>
            <input type="email" id="loginCorreo" required>

            <label>Contraseña</label>
            <input type="password" id="loginContrasena" required>

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/clientes.js"></script>

</body>

</html>
